name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y --no-install-recommends stockfish
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install chess numpy pandas pyarrow h5py pyyaml fastapi httpx pytest
      - run: pytest -q
